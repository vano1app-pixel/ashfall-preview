<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080d">
  <meta name="description" content="Watch ASHFALL, an original 30-second 3D fight study.">
  <title>ASHFALL — 30-second fight study</title>
  <style>
    :root { color-scheme: dark; background: #06080d; color: #eff4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg,#48ccf4 0 50%,#ed713e 50%); }
    main { width: min(100% - 40px, 1120px); margin: 0 auto; padding: clamp(44px,8vw,90px) 0 36px; }
    .kicker { color: #80a4b7; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(56px,12vw,132px); font-weight: 400; line-height: .95; letter-spacing: -.055em; margin: 13px 0 30px; }
    .player { padding: 1px; background: linear-gradient(110deg,#245268,#29313d 48%,#85432c); box-shadow: 0 28px 80px #0009; }
    video { display: block; width: 100%; aspect-ratio: 16/9; background: #000; }
    .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-top: 18px; color: #aab7c1; font-size: 14px; line-height: 1.5; }
    .meta p { margin: 0; }
    a { color: #b8eafd; text-underline-offset: 4px; }
    a:hover { color: white; }
    @media (max-width: 640px) { main { width: min(100% - 24px, 1120px); padding-top: 36px; } h1 { margin-bottom: 24px; } .meta { display: block; } .meta a { display: inline-block; margin-top: 9px; } }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Original 3D fight study / 00:30</div>
    <h1>ASHFALL.</h1>
    <div class="player">
      <video controls playsinline preload="metadata" poster="poster.jpg" aria-label="Play the ASHFALL 30-second fight clip">
        <source src="ashfall-30s.mp4" type="video/mp4">
        Your browser cannot play this video. <a href="ashfall-30s.mp4">Download the clip</a>.
      </video>
    </div>
    <div class="meta">
      <p>Press play and turn on sound. Best viewed full screen.</p>
      <a href="ashfall-30s.mp4" download>Download MP4</a>
    </div>
  </main>
</body>
</html>
